# nginx/nginx.conf
events { 
    worker_connections 1024;
 }

http {
    upstream gateway_upstream {
        # If you scale gateway to multiple containers, list them here
        server gateway:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Serve React static files from the react container
        location / {
            proxy_pass http://react-frontend:80;   # React container serves index.html
            proxy_set_header Host $host;
        }

        # Proxy API requests to the gateway
        location /api/ {
            proxy_pass http://gateway_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}