version: '3.8'

services:
  ai-service:
    build: ./ai-service
    ports:
      - "50051:50051"   # Optional: expose for debugging
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}  # From .env file
    networks:
      - app-network

  gateway:
    build: ./gateway
    environment:
      - AI_SERVICE_HOST=ai-service
      - AI_SERVICE_PORT=50051
    depends_on:
      - ai-service
    networks:
      - app-network

  react-frontend:
    build: ./frontend
    networks:
      - app-network

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - gateway
      - react-frontend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge